<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🐸</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #89f7fe, #66a6ff);
      font-family: sans-serif;
      overflow: hidden;
    }

    .container {
      text-align: center;
    }

    .boy {
      font-size: 100px;
      animation: dance 0.5s infinite alternate ease-in-out;
      display: inline-block;
    }

    .text {
      margin-top: 20px;
      font-size: 36px;
      font-weight: bold;
      color: white;
      text-shadow: 3px 3px 5px #333;
      animation: pop 1s infinite alternate;
    }

    @keyframes dance {
      0% {
        transform: rotate(-15deg) translateY(0) scale(1);
      }
      50% {
        transform: rotate(15deg) translateY(-25px) scale(1.1);
      }
      100% {
        transform: rotate(-15deg) translateY(0) scale(1);
      }
    }

    @keyframes pop {
      from {
        transform: scale(1);
      }
      to {
        transform: scale(1.15);
      }
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="boy">🕺</div>
    <div class="text">কীরে, বোকাচোদা 😂</div>
  </div>

</body>
</html>
